name = "step"
account_id = "66ce3adbb96f6715f8cc2b04991c30e4"
compatibility_date = "2026-06-15"
main = "./worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
STEP_WEB_EXPLORER_URL = "/explorer"
STEP_WEB_MINER_URL = "/miner"
# Backend reached over the self-hosted `step-backend` Cloudflare tunnel from the
# always-on Mac (scripts/ops/backend-tunnel.mjs). Live once the owner adds the two
# proxied CNAMEs (gw/idx.step.regiominer.com → <tunnel-id>.cfargotunnel.com) and
# the worker is redeployed (`pnpm run deploy:cloudflare-worker`).
STEP_BACKEND_GATEWAY_URL = "https://gw.step.regiominer.com"
STEP_BACKEND_INDEXER_URL = "https://idx.step.regiominer.com"
