# XcodeGen spec for the shippable STEP iOS app (M7 #33). Checked in instead of a
# hand-edited .pbxproj so the project is reproducible and diffs stay reviewable:
#   cd apps/ios/App && xcodegen generate && open StepApp.xcodeproj
#
# The StepApp target depends on the local StepCore SPM package (../StepCore) and
# its StepAppUI product — all feature code lives there; this target only wires +
# packages it.
name: StepApp
options:
  bundleIdPrefix: com.regiominer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  StepCore:
    path: ../StepCore

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "7"   # 0.1.0(7): Face ID fixes + live marketplace/NFT addresses
    SWIFT_VERSION: "6.0"
    ALWAYS_SEARCH_USER_PATHS: NO   # silence the legacy-headermap build warning
    DEVELOPMENT_TEAM: "" # set locally / in CI signing; empty for unsigned simulator builds
    # Endpoint configuration consumed by Info.plist → AppConfig. Override per
    # configuration with an .xcconfig. Defaults target the live pilot backend
    # (Cloudflare tunnel `step-backend` → tribecca); gw/idx/acc/nft
    # .step.regiominer.com are proxied CNAMEs to the tunnel (backend-tunnel.mjs).
    STEP_GATEWAY_URL: "https://gw.step.regiominer.com"
    STEP_MESH_URL: "https://gw.step.regiominer.com"
    STEP_INDEXER_URL: "https://idx.step.regiominer.com"
    STEP_ACCOUNT_URL: "https://acc.step.regiominer.com"
    STEP_NFT_INDEXER_URL: "https://nft.step.regiominer.com"
    STEP_WEB_APP_URL: "https://step.moldovancsaba.workers.dev/?surface=ios-map"
    STEP_RPC_URL: ""
    STEP_MARKETPLACE_ADDRESS: "0xe8b3451a2e3B8d80852a1788102277da7a813402"
    STEP_NFT_ADDRESS: "0x42db8b03409822a47cb969aA324a192DCD81eEB9"
    STEP_TRINITY_ADDRESS: "0x07Aa076883658B7ED99D25b1E6685808372C8fE2"

targets:
  StepApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      # StepApp.swift imports BOTH modules directly, so depend on both products
      # explicitly — don't rely on StepCore being importable transitively via
      # StepAppUI (that's fragile across Xcode versions → "no such module").
      - package: StepCore
        product: StepCore
      - package: StepCore
        product: StepAppUI
    settings:
      base:
        # Reference the hand-authored, version-controlled Info.plist and
        # entitlements as build settings. Do NOT use XcodeGen's `info:` /
        # `entitlements:` target keys — those make XcodeGen GENERATE (and thus
        # overwrite) the files, clobbering the usage strings + App Attest/NFC.
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: StepApp.entitlements
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: StepApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.regiominer.miner
        CODE_SIGN_STYLE: Automatic

  StepAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: StepApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.regiominer.miner.uitests

schemes:
  StepApp:
    build:
      targets:
        StepApp: all
        StepAppUITests: [test]
    test:
      targets:
        - StepAppUITests
