# Cloudflare Workers static site for regiominer.com (#33 publishing).
# Serves the built dist/ (index, privacy, terms, support) with clean URLs
# (/privacy → privacy.html). Deploy:
#
#   CLOUDFLARE_API_TOKEN=*** npx wrangler deploy   # from this directory
#
# The custom-domain routes require regiominer.com to be an active zone on this
# Cloudflare account (it is). wrangler provisions the hostname records for a
# Workers custom domain automatically.
#
# NOTE: top-level keys (incl. `routes`) MUST appear before any [table] header,
# or TOML nests them under the preceding table (e.g. assets.routes) and they're
# silently ignored.
name = "regiominer"
account_id = "66ce3adbb96f6715f8cc2b04991c30e4"
compatibility_date = "2026-06-15"

# Keep the workers.dev URL as a guaranteed fallback.
workers_dev = true

# Attach to the existing regiominer.com hostname via a Workers Route (not a
# custom domain) — this binds to the zone's existing proxied DNS record and
# needs only Workers Routes:Edit, NOT Zone DNS:Edit (which this token lacks).
routes = [
  { pattern = "regiominer.com/*", zone_name = "regiominer.com" },
  { pattern = "www.regiominer.com/*", zone_name = "regiominer.com" },
]

# Build dist/ before deploy (no dependencies — plain Node).
[build]
command = "node build.mjs"

[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"   # /privacy serves privacy.html
not_found_handling = "404-page"
