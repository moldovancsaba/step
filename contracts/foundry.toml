[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 512 }
invariant = { runs = 64, depth = 32 }
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 100
