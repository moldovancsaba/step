[package]
name = "step-validation-rules"
version = "0.1.0"
description = "Deterministic STEP claim validation checks shared by validator nodes"
edition.workspace = true
license.workspace = true

[dependencies]
step-mesh-engine = { path = "../mesh-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hex = "0.4"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
thiserror = "2"
