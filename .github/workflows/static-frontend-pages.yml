name: static-frontend-pages

on:
  workflow_dispatch:
    inputs:
      gateway_url:
        description: "Public gateway URL, e.g. https://gateway.example.com"
        required: true
      indexer_url:
        description: "Public indexer URL, e.g. https://indexer.example.com"
        required: true
  push:
    branches: [main]
    paths:
      - "apps/static-frontend/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/static-frontend-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @step/static-frontend build
      - name: Write runtime config
        env:
          GATEWAY_URL: ${{ inputs.gateway_url || vars.STEP_STATIC_GATEWAY_URL || 'http://127.0.0.1:8080' }}
          INDEXER_URL: ${{ inputs.indexer_url || vars.STEP_STATIC_INDEXER_URL || 'http://127.0.0.1:8090' }}
        run: |
          cat > apps/static-frontend/dist/config.js <<EOF
          window.STEP_CONFIG = {
            gatewayUrl: "${GATEWAY_URL}",
            indexerUrl: "${INDEXER_URL}"
          };
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/static-frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
